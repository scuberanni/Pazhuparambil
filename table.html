<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pazhuparambil Furniture Gallery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" href="images/html-logo.png" type="image/gif">
    
    <link rel="stylesheet" href="https://unpkg.com/photoswipe@5.4.3/dist/photoswipe.css">
    
    <style>
        /* --- Main Page Grid Styling (ഇതിൽ മാറ്റമില്ല) --- */
        .neon-card {
            position: relative; 
            height: 300px; 
            overflow: hidden; 
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }
        .neon-card:hover {
            transform: scale(1.02);
        }

        @media (min-width: 768px) {
            .neon-card { height: 400px; }
        }

        /* View Image ബട്ടൺ സ്റ്റൈൽ */
        .view-btn {
            position: absolute; 
            bottom: 15px; 
            left: 50%; 
            transform: translateX(-50%); 
            z-index: 1; 
            font-weight: 600;
        }

        /* --- PhotoSwipe ബട്ടണുകൾ മൊബൈലിലും വലുതായി കാണാൻ --- */
        .pswp__button {
            background-color: rgba(0, 0, 0, 0.4) !important;
            border-radius: 10px;
            margin: 5px;
        }
        .pswp__button--arrow {
            width: 50px !important;
            height: 60px !important;
        }
        /* മൊബൈലിൽ Arrows മറക്കരുത് എന്ന് നമ്മൾ നിർബന്ധം പിടിക്കുന്നു */
        @media (max-width: 767px) {
            .pswp__button--arrow {
                display: block !important; 
                visibility: visible !important;
            }
        }
    </style>
</head>

<body class="bg-danger">

    <header>
        <nav class="navbar navbar-expand-lg bg-warning fixed-top shadow-sm">
            <div class="container-fluid ">
                <a class="navbar-brand fw-bold" href="index.html#collection">Pazhuparambil Furniture Gallery</a>
            </div>
        </nav>
    </header>

    <section>
        <div class="container-fluid pt-3">
            <div class="row px-2 ">
                <div class="col-12 pt-5 mt-3">
                    
                    <div class="row pswp-gallery" id="gallery-grid">
                        </div>

                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script type="module">
        import PhotoSwipeLightbox from 'https://unpkg.com/photoswipe@5.4.3/dist/photoswipe-lightbox.esm.js';
        import PhotoSwipe from 'https://unpkg.com/photoswipe@5.4.3/dist/photoswipe.esm.js';

        // എത്രാമത്തെ ഇമേജ് വരെ വേണം
        const totalImages = 55; 
        const galleryGrid = document.getElementById('gallery-grid');
        let gridHTML = '';

        // ഇമേജുകൾ Grid-ലേക്ക് ലോഡ് ചെയ്യുന്നു
        for (let i = 1; i <= totalImages; i++) {
            const imageUrl = `images/FURNITURES/TABLE&TEAPOY/TABLE (${i}).jpeg`;

            // PhotoSwipe-ന് ഇമേജിന്റെ വീതിയും ഉയരവും (Width, Height) ആവശ്യമാണ്. 
            // എങ്കിൽ മാത്രമേ സൂമിംഗ് കൃത്യമായി വർക്ക് ആവൂ.
            // Ivide njan 1200x900 enn koduuthirikkunnu. Ningalkk pattumenkil oro imaginteyum 
            // കൃത്യമായ width, height kodukkuka (Udaharanathinu: 1920, 1080).
            const imgWidth = 1200; 
            const imgHeight = 900; 

            gridHTML += `
                <div class="col-12 col-md-4 col-lg-3 pt-3"> 
                    <div class="neon-card">
                        <img class="rounded-3 w-100 h-100" style="object-fit: cover;" src="${imageUrl}" loading="lazy" alt="Table ${i}">
                        
                        <a href="${imageUrl}" 
                           data-pswp-width="${imgWidth}" 
                           data-pswp-height="${imgHeight}" 
                           target="_blank" 
                           class="btn btn-light btn-sm shadow view-btn">
                            View Image
                        </a>
                    </div>
                </div>
            `;
        }
        galleryGrid.innerHTML = gridHTML;

        // 4. PhotoSwipe ലൈബ്രറി ആക്ടിവേറ്റ് ചെയ്യുന്നു
        const lightbox = new PhotoSwipeLightbox({
            gallery: '#gallery-grid', // ഏത് Grid-ലെ ലിങ്കുകളാണ് എടുക്കേണ്ടത്
            children: 'a.view-btn', // 'View Image' ബട്ടൺ ക്ലിക്ക് ചെയ്യുമ്പോൾ
            pswpModule: PhotoSwipe, // പ്രധാന മോഡ്യൂൾ
            // ചില എക്സ്ട്രാ ഓപ്ഷനുകൾ
            bgOpacity: 0.95, // ബാക്ക്ഗ്രൗണ്ട് കറുപ്പ് നിറം
            loop: true, // അവസാനത്തെ ഇമേജിൽ നിന്നും next അടിച്ചാൽ ആദ്യത്തെ ഇമേജ് വരും
        });
        lightbox.init(); // സ്റ്റാർട്ട് ചെയ്യുന്നു
    </script>
</body>

</html>
