<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pazhuparambil Furniture Gallery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="icon" href="images/html-logo.png" type="image/gif">
    <link rel="stylesheet" href="index.css">
    
    <style>
        /* --- MAIN PAGE GRID --- */
        .neon-card {
            position: relative; 
            height: 300px; 
            overflow: hidden; 
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        @media (min-width: 768px) {
            .neon-card {
                height: 400px; 
            }
        }

        /* --- പുതിയ CUSTOM LIGHTBOX (No Bootstrap Slider) --- */
        #custom-lightbox {
            display: none; /* ആദ്യമേ മറച്ചു വെക്കുന്നു */
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh; /* മൊബൈൽ സ്ക്രീൻ ഫിറ്റ് ആവാൻ */
            background-color: rgba(0, 0, 0, 0.95); /* കറുത്ത ബാക്ക്ഗ്രൗണ്ട് */
            z-index: 99999;
            align-items: center;
            justify-content: center;
        }

        /* ഇമേജ് ഒട്ടും കട്ട് ആവാതെ ഇരിക്കാൻ */
        #custom-lightbox img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; 
        }

        /* Next, Prev, Close ബട്ടണുകളുടെ ഡിസൈൻ */
        .lb-btn {
            position: absolute;
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            cursor: pointer;
            z-index: 100000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        
        .lb-btn:hover {
            background-color: rgba(255, 255, 255, 0.5);
            color: black;
        }

        /* Close Button */
        .lb-close {
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 20px;
        }

        /* Previous Button */
        .lb-prev {
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 50px;
            border-radius: 10px;
            font-size: 24px;
        }

        /* Next Button */
        .lb-next {
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 50px;
            border-radius: 10px;
            font-size: 24px;
        }
    </style>
</head>

<body class="bg-danger">

    <header>
        <nav class="navbar navbar-expand-lg bg-warning fixed-top shadow-sm">
            <div class="container-fluid ">
                <a class="navbar-brand fw-bold" href="index.html#collection">Pazhuparambil Furniture Gallery</a>
            </div>
        </nav>
    </header>

    <section>
        <div class="container-fluid pt-3">
            <div class="row px-2 ">
                <div class="col-12 pt-5 mt-3">
                    <section class="row" id="gallery-grid">
                    </section>
                </div>
            </div>
        </div>
    </section>

    <div id="custom-lightbox">
        <button class="lb-btn lb-close" onclick="closeLightbox()">X</button>
        <button class="lb-btn lb-prev" onclick="prevImage()">&#10094;</button>
        
        <img id="lightbox-img" src="" alt="Gallery Image">
        
        <button class="lb-btn lb-next" onclick="nextImage()">&#10095;</button>
    </div>

    <script>
        const totalImages = 55; 
        const galleryGrid = document.getElementById('gallery-grid');
        let gridHTML = '';

        // 1. ഗാലറി ഇമേജുകൾ ലോഡ് ചെയ്യുന്നു
        for (let i = 1; i <= totalImages; i++) {
            const imageUrl = `images/FURNITURES/TABLE&TEAPOY/TABLE (${i}).jpeg`;

            gridHTML += `
                <div class="col-12 col-md-4 col-lg-3 pt-3"> 
                    <div class="neon-card">
                        <img class="rounded-3 w-100 h-100" style="object-fit: cover;" src="${imageUrl}" loading="lazy" alt="Table ${i}">
                        <button class="btn btn-light btn-sm shadow" onclick="openLightbox(${i})"
                            style="position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); z-index: 1; font-weight: 600;">
                            View Image
                        </button>
                    </div>
                </div>
            `;
        }
        galleryGrid.innerHTML = gridHTML;

        // 2. LIGHTBOX CONTROLS (ഏത് ഇമേജ് വരണം എന്ന് തീരുമാനിക്കുന്ന കോഡ്)
        let currentIndex = 1;

        function openLightbox(index) {
            currentIndex = index; // നമ്മൾ ക്ലിക്ക് ചെയ്ത നമ്പർ എടുക്കുന്നു
            updateImage();
            document.getElementById('custom-lightbox').style.display = 'flex'; // വ്യൂ ഓപ്പൺ ചെയ്യുന്നു
        }

        function closeLightbox() {
            document.getElementById('custom-lightbox').style.display = 'none'; // വ്യൂ ക്ലോസ് ചെയ്യുന്നു
        }

        function prevImage() {
            currentIndex--;
            if (currentIndex < 1) {
                currentIndex = totalImages; // ഒന്നാമത്തെ ഇമേജിൽ നിന്നും back അടിച്ചാൽ അവസാനത്തെ ഇമേജ് വരും
            }
            updateImage();
        }

        function nextImage() {
            currentIndex++;
            if (currentIndex > totalImages) {
                currentIndex = 1; // അവസാനത്തെ ഇമേജിൽ നിന്നും Next അടിച്ചാൽ ഒന്നാമത്തെ ഇമേജ് വരും
            }
            updateImage();
        }

        function updateImage() {
            // ഇമേജ് മാറാനുള്ള ലിങ്ക് കൊടുക്കുന്നു
            const imgElement = document.getElementById('lightbox-img');
            imgElement.src = `images/FURNITURES/TABLE&TEAPOY/TABLE (${currentIndex}).jpeg`;
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>
</body>

</html>
