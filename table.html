<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pazhuparambil Furniture Gallery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="icon" href="images/html-logo.png" type="image/gif">
    <link rel="stylesheet" href="index.css">
    
    <style>
        /* --- RESPONSIVE GRID SETTINGS --- */
        /* Mobile Screen-il ulla height (Default) */
        .neon-card {
            position: relative; 
            height: 300px; /* Mobile-il height kurachu */
            overflow: hidden; 
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        /* Desktop Screen-il ulla height (768px-nu mukalil) */
        @media (min-width: 768px) {
            .neon-card {
                height: 400px; 
            }
        }

        /* --- FULL SCREEN SLIDER SETTINGS --- */
        .carousel-item {
            height: 100vh; 
            background-color: #000000; 
        }
        
        .carousel-item img {
            height: 100%;
            width: 100%;
            object-fit: contain; 
            margin: auto;
        }
        
        /* Mobile-il notch/status bar thattathirikkan 'safe-area' vechu close button set cheythu */
        .custom-close-btn {
            position: absolute;
            top: max(20px, env(safe-area-inset-top)); 
            right: 20px;
            z-index: 1055;
            background-color: rgba(255, 255, 255, 0.7);
            padding: 15px;
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        /* Mobile-il prev/next arrow-kalude vellicham kurachu kannil adikkathirikkan */
        .carousel-control-prev-icon,
        .carousel-control-next-icon {
            background-color: rgba(0, 0, 0, 0.5);
            border-radius: 50%;
            padding: 20px;
        }
    </style>
</head>

<body class="bg-danger">

    <header>
        <nav class="navbar navbar-expand-lg bg-warning fixed-top shadow-sm">
            <div class="container-fluid ">
                <a class="navbar-brand fw-bold" href="index.html#collection">Pazhuparambil Furniture Gallery</a>
            </div>
        </nav>
    </header>

    <section>
        <div class="container-fluid pt-3">
            <div class="row px-2 ">
                <div class="col-12 pt-5 mt-3">
                    
                    <section class="row" id="gallery-grid">
                    </section>

                </div>
            </div>
        </div>
    </section>

    <div class="modal fade" id="imageSliderModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-fullscreen m-0">
            <div class="modal-content bg-black border-0 rounded-0">
                
                <button type="button" class="btn-close btn-close-dark custom-close-btn" data-bs-dismiss="modal" aria-label="Close"></button>
                
                <div class="modal-body p-0">
                    <div id="galleryCarousel" class="carousel slide h-100" data-bs-touch="true">
                        <div class="carousel-inner h-100" id="carousel-items">
                            </div>
                        
                        <button class="carousel-control-prev" type="button" data-bs-target="#galleryCarousel" data-bs-slide="prev">
                            <span class="carousel-control-prev-icon" aria-hidden="true" style="width: 2.5rem; height: 2.5rem;"></span>
                            <span class="visually-hidden">Previous</span>
                        </button>
                        <button class="carousel-control-next" type="button" data-bs-target="#galleryCarousel" data-bs-slide="next">
                            <span class="carousel-control-next-icon" aria-hidden="true" style="width: 2.5rem; height: 2.5rem;"></span>
                            <span class="visually-hidden">Next</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // IVIDE NINNU NUMBER MATTIYAL MATHI
        const totalImages = 55; 
        
        const galleryGrid = document.getElementById('gallery-grid');
        const carouselItems = document.getElementById('carousel-items');

        let gridHTML = '';
        let sliderHTML = '';

        for (let i = 1; i <= totalImages; i++) {
            const imageUrl = `images/FURNITURES/TABLE&TEAPOY/TABLE (${i}).jpeg`;

            // 1. Main Page Grid Design
            gridHTML += `
                <div class="col-12 col-md-4 col-lg-3 pt-3"> 
                    <div class="neon-card">
                        <img class="rounded-3 w-100 h-100" style="object-fit: cover;" src="${imageUrl}" loading="lazy" alt="Table ${i}">
                        <button class="btn btn-light btn-sm shadow" onclick="openSlider(${i - 1})"
                            style="position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); z-index: 1; font-weight: 600;">
                            View Image
                        </button>
                    </div>
                </div>
            `;

            // 2. Slider Design
            let isActive = i === 1 ? 'active' : '';
            sliderHTML += `
                <div class="carousel-item ${isActive}">
                    <img src="${imageUrl}" loading="lazy" alt="Table ${i}">
                </div>
            `;
        }

        galleryGrid.innerHTML = gridHTML;
        carouselItems.innerHTML = sliderHTML;

        function openSlider(index) {
            const myCarousel = document.querySelector('#galleryCarousel');
            const carousel = bootstrap.Carousel.getOrCreateInstance(myCarousel);
            carousel.to(index);

            const myModal = new bootstrap.Modal(document.getElementById('imageSliderModal'));
            myModal.show();
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>
</body>

</html>
